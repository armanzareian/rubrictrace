name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: make test
      - run: make quality
      - run: make demo
      - name: Generate audit Markdown summary
        run: |
          python -m rubrictrace audit \
            --records examples/judgments/records.jsonl \
            --policy examples/judgments/policy.json \
            --format markdown \
            --fail-on critical >> "$GITHUB_STEP_SUMMARY"
      - name: Generate audit SARIF report
        run: |
          python -m rubrictrace audit \
            --records examples/judgments/records.jsonl \
            --policy examples/judgments/policy.json \
            --format sarif \
            --fail-on critical > rubrictrace.sarif
          python -m json.tool rubrictrace.sarif > /dev/null
      - run: make eval
      - run: make metrics
      - run: make sarif
      - run: make baseline
      - run: make ci-template
      - run: make api-example
